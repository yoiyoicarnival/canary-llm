[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "canary-llm"
version = "0.2.0"
description = "Lightweight pre-RAG routing layer for LLM applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["llm", "rag", "routing", "retrieval", "nlp", "ai-observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.21",
    "transformers>=4.30",
    "torch>=2.0",
]

[project.optional-dependencies]
score  = ["scikit-learn>=1.0"]
server = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2.0"]
dev    = ["datasets>=2.0", "pytest>=7.0", "scikit-learn>=1.0"]

[project.scripts]
canary = "canary.cli:main"

[project.urls]
Homepage   = "https://github.com/yoiyoicarnival/canary-llm"
Repository = "https://github.com/yoiyoicarnival/canary-llm"

[tool.setuptools.packages.find]
where = ["."]
include = ["canary*"]
